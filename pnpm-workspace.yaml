packages:
  - starter

# Never run the install scripts that dependencies ship with; the build does not need them. Commit this declaration with the repo:
# since pnpm 11, undeclared install scripts make pnpm install fail outright
allowBuilds:
  esbuild: false
  sharp: false

minimumReleaseAgeExclude:
  - '@vergil-astro/vergil-cli@0.2.0 || 0.2.1'
