name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    # Build once on the lowest supported version and once on the latest LTS (engines in package.json requires Node 24 or later)
    strategy:
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Only run the build for now, to secure the baseline of catching breakage.
      # prettier --check currently fails: 147 files are not formatted correctly, and another 8 files
      # cannot be parsed by prettier. Add it back after a separate formatting pass.
      - run: pnpm build
